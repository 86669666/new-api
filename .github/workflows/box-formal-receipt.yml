name: Box formal receipt consumer
run-name: ${{ inputs.mode == 'terminal' && format('Formal terminal {0}', inputs.intent) || inputs.mode == 'consumer' && github.ref == 'refs/heads/codex/formal-quality-r15' && format('Formal delta {0}', inputs.intent) || 'Box formal receipt consumer' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select a protected formal workflow operation
        type: choice
        options: [consumer, terminal, preflight]
        default: consumer
      intent:
        description: SHA-256 of the exact evidence selected for this approval
        type: string
        required: false
permissions: {}
jobs:
  legacy:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'consumer'
    name: Verify legacy box receipt
    runs-on: ubuntu-latest
    environment: box-formal-consumer
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Require approved immutable workflow revision
        env:
          TRUSTED_SHA: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$TRUSTED_SHA"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: 86669666/new-api
          ref: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/box-formal-consumer
        with:
          trusted-sha: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          admission: ${{ vars.BOX_FORMAL_ADMISSION }}
          token: ${{ github.token }}
  consume:
    name: Verify authenticated box receipt
    if: github.ref == 'refs/heads/codex/formal-quality-r15' && (inputs.mode == 'consumer' || inputs.mode == 'preflight')
    runs-on: ubuntu-latest
    environment: box-formal-consumer-v2
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Require approved immutable workflow revision
        env:
          TRUSTED_SHA: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$TRUSTED_SHA"
          test "$GITHUB_SHA" = "$TRUSTED_SHA"
          test "$GITHUB_ACTOR_ID" = 358061300
          test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Require evidence selection
        if: inputs.mode == 'consumer'
        env:
          INTENT: ${{ inputs.intent }}
        run: '[[ "$INTENT" =~ ^[0-9a-f]{64}$ ]]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: inputs.mode == 'consumer'
        with:
          repository: 86669666/new-api
          ref: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          persist-credentials: false
      - name: Verify complete private evidence
        if: inputs.mode == 'consumer'
        env:
          BOX_FORMAL_CONSUMER_SHA: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          BOX_FORMAL_ADMISSION: ${{ vars.BOX_FORMAL_ADMISSION }}
          BOX_FORMAL_EVIDENCE_TOKEN: ${{ secrets.BOX_FORMAL_EVIDENCE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/quality_results.py independent-stream-delta-consumer
  terminal:
    name: Review formal quality evidence
    if: github.ref == 'refs/heads/codex/formal-quality-r15' && inputs.mode == 'terminal'
    runs-on: ubuntu-latest
    environment: box-formal-terminal
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Require terminal proof selection
        env:
          INTENT: ${{ inputs.intent }}
        run: '[[ "$INTENT" =~ ^[0-9a-f]{64}$ ]]'
      - name: Require approved immutable workflow revision
        env:
          TRUSTED_SHA: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$TRUSTED_SHA"
          test "$GITHUB_SHA" = "$TRUSTED_SHA"
          test "$GITHUB_ACTOR_ID" = 358061300
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: 86669666/new-api
          ref: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          persist-credentials: false
      - name: Verify reviewed execution
        env:
          BOX_FORMAL_CONSUMER_SHA: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          BOX_FORMAL_ADMISSION: ${{ vars.BOX_FORMAL_ADMISSION }}
          BOX_FORMAL_HOSTED_RUN_ID: ${{ vars.BOX_FORMAL_HOSTED_RUN_ID }}
          BOX_FORMAL_HOSTED_RUN_ATTEMPT: ${{ vars.BOX_FORMAL_HOSTED_RUN_ATTEMPT }}
          BOX_FORMAL_HOSTED_CI_BLOB: ${{ vars.BOX_FORMAL_HOSTED_CI_BLOB }}
          BOX_FORMAL_EVIDENCE_TOKEN: ${{ secrets.BOX_FORMAL_EVIDENCE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/quality_results.py independent-stream-delta-terminal
