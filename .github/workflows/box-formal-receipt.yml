name: PR258 independent App preflight
on:
  workflow_dispatch:
permissions: {}
jobs:
  identity:
    name: Verify trigger identity
    if: github.ref == 'refs/heads/codex/pr258-app-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check App actor and immutable ref
        env:
          EXPECTED_SHA: ${{ vars.BOX_FORMAL_PREFLIGHT_SHA }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_ACTOR_ID" = 358061300
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_SHA"
  review:
    name: Check independent review eligibility
    needs: identity
    environment: box-formal-trigger-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo 'Independent approval preflight only'
