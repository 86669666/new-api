name: Publish Docker image (manual branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to publish in the preview namespace; never promotes latest'
        required: true
        type: string

permissions:
  contents: read

# Keep stable and preview pending runs (up to GitHub's 100-run queue limit).
# All Docker publishers share this lock. Receipts, rather than tags, bind the run.
concurrency:
  group: publish-docker-new-api
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      version: ${{ steps.freeze.outputs.version }}
      alias: ${{ steps.freeze.outputs.alias }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refs/heads/${{ inputs.branch }}
      - name: Freeze branch commit and preview namespace
        id: freeze
        env:
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          git check-ref-format "refs/heads/$BRANCH_NAME"
          PREFIX=$(python3 scripts/ci/release_policy.py preview-alias --branch="$BRANCH_NAME")
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "alias=$PREFIX" >> "$GITHUB_OUTPUT"
          VERSION="$PREFIX-${SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "${#VERSION}" -le 128
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}

  build_single_arch:
    needs: [prepare, quality]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.quality.outputs.verified_sha }}
      - name: Verify candidate and write build version
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          VERIFIED_SHA: ${{ needs.quality.outputs.verified_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -n "$VERIFIED_SHA"
          test "$CANDIDATE_SHA" = "$VERIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          echo "$VERSION" > VERSION
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: calciumion/new-api
          labels: org.opencontainers.image.revision=${{ needs.quality.outputs.verified_sha }}
      - name: Build and push run-scoped image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: calciumion/new-api:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign immutable image and record candidate receipt
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          CANDIDATE_SHA: ${{ needs.quality.outputs.verified_sha }}
        run: |
          cosign sign --yes "calciumion/new-api@$DIGEST"
          python3 scripts/ci/release_policy.py receipt --directory receipts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: receipts/*.json
          if-no-files-found: error

  create_manifests:
    needs: [prepare, quality, build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.quality.outputs.verified_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: digest-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: receipts
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Assemble and sign this run's immutable manifest
        id: manifest
        env:
          CANDIDATE_SHA: ${{ needs.quality.outputs.verified_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 scripts/ci/release_policy.py sources --directory receipts > sources.txt
          mapfile -t SOURCES < sources.txt
          docker buildx imagetools create -t "calciumion/new-api:$VERSION" --metadata-file manifest.json "${SOURCES[@]}"
          DIGEST=$(jq -er '."containerimage.descriptor".digest | select(test("^sha256:[0-9a-f]{64}$"))' manifest.json)
          cosign sign --yes "calciumion/new-api@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Candidate $CANDIDATE_SHA: calciumion/new-api@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote preview alias only while the branch still names this candidate
        env:
          BRANCH_NAME: ${{ inputs.branch }}
          CANDIDATE_SHA: ${{ needs.quality.outputs.verified_sha }}
          PREVIEW_ALIAS: ${{ needs.prepare.outputs.alias }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/$BRANCH_NAME" | cut -f1)
          if [ "$REMOTE_SHA" = "$CANDIDATE_SHA" ]; then
            docker buildx imagetools create -t "calciumion/new-api:$PREVIEW_ALIAS" "calciumion/new-api@$DIGEST"
          fi
