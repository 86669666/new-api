name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # Reusable only from the same open-PR event. Publication callers stay blocked:
  # postmerge, tag and release verification is not implemented by this reader.
  workflow_call:
    inputs:
      sha:
        description: Exact current open-PR head (premerge only; no release authorization)
        required: true
        type: string
    outputs:
      verified_sha:
        description: Verified open-PR head only; never a merge/tag/release authorization
        value: ${{ jobs.quality-gate.outputs.sha }}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.sha || github.ref }}
  cancel-in-progress: true

# Validate only an open PR's exact head and current base. A merge/squash/tag SHA
# needs its own authenticated lifecycle contract, which is not supported here.
jobs:
  premerge:
    name: Require supported premerge event
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject unsupported lifecycle or publication caller
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]] || [[ "$EVENT_ACTION" != opened && "$EVENT_ACTION" != reopened && "$EVENT_ACTION" != synchronize ]]; then
            echo "::error::Only open-PR premerge verification is supported; postmerge, tag and publication callers are unsupported."
            exit 1
          fi

  backend:
    name: Backend vet, build, and test
    needs: premerge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      # Formal execution remains separate. The final gate independently reads
      # the authenticated, complete App quality result for this exact SHA.
      # Candidate code is never attached to a self-hosted runner by this CI.
      - name: Policy and consumer regression tests
        run: |
          python3 -I -B -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 -I -B -m unittest discover -s .github/actions/box-formal-consumer -p 'test_*.py'

  frontend:
    name: Frontend typecheck and test
    needs: premerge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  database:
    name: Required real database contracts
    needs: premerge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: newapi_ci_contracts
        ports:
          - '127.0.0.1::3306'
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: newapi_ci_contracts
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_ci_contracts"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Required three-database suite (no skips)
        env:
          NEWAPI_TEST_PROFILE: isolated-ci
          TEST_MYSQL_DSN: root@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/newapi_ci_contracts?parseTime=true
          TEST_POSTGRES_DSN: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/newapi_ci_contracts?sslmode=disable
        run: python3 scripts/ci/database_gate.py

  quality-gate:
    name: Required quality gate
    needs: [premerge, backend, frontend, database]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: box-formal-consumer
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Require immutable trusted quality reader
        env:
          TRUSTED_SHA: ${{ vars.BOX_FORMAL_READER_SHA }}
        run: '[[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      # Never execute the candidate's verifier with protected admission data.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: 86669666/new-api
          ref: ${{ vars.BOX_FORMAL_READER_SHA }}
          path: trusted-quality
          persist-credentials: false
      - name: Verify hosted jobs and authenticated exact-candidate quality
        id: verify
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          QUALITY_RESULTS: '{"backend":"${{ needs.backend.result }}","frontend":"${{ needs.frontend.result }}","database":"${{ needs.database.result }}"}'
          BOX_FORMAL_CONSUMER_SHA: ${{ vars.BOX_FORMAL_CONSUMER_SHA }}
          BOX_FORMAL_ADMISSION: ${{ vars.BOX_FORMAL_ADMISSION }}
          BOX_FORMAL_REVIEWER_IDS: ${{ vars.BOX_FORMAL_REVIEWER_IDS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B trusted-quality/scripts/ci/quality_results.py ci
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
